name: Repair Stadslass function package v69 byte identity

on:
  push:
    branches:
      - main
    paths:
      - 'v69-repair/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_URL: https://raw.githubusercontent.com/Gagge007/stadslass-3.0-updates/main/function-package-v69.zip
      TARGET_SHA256: e57c44f211aae292e04435ed62eff597828a6b186c5795de74a99be3b89eb5c9
      TARGET_SIZE: '305858'
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current package without cache
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/current-v69.zip" \
            "$SOURCE_URL?repair_run=$GITHUB_RUN_ID"
          unzip -t "$RUNNER_TEMP/current-v69.zip"
          mkdir "$RUNNER_TEMP/v69-source"
          unzip -q "$RUNNER_TEMP/current-v69.zip" -d "$RUNNER_TEMP/v69-source"

      - name: Run all packaged tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v69-source"
          export TZ=Europe/Stockholm
          for test_file in tests/*.test.js; do
            echo "RUN node $test_file"
            node "$test_file"
          done
          for test_file in tests/*.test.py tests/integration_app.py; do
            [ -f "$test_file" ] || continue
            echo "RUN python $test_file"
            python "$test_file"
          done

      - name: Rebuild package with UTC ZIP timestamps
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v69-source"
          {
            echo module.json
            find css -type f | sort
            find data -type f | sort
            echo index.html
            find js -type f | sort
            find reports -type f | sort
            find tests -type f | sort
          } > "$RUNNER_TEMP/v69-order.txt"
          while IFS= read -r file; do
            touch -d '2026-08-03 02:35:00 UTC' "$file"
            chmod 0644 "$file"
          done < "$RUNNER_TEMP/v69-order.txt"
          TZ=UTC python - "$RUNNER_TEMP/v69-order.txt" "$RUNNER_TEMP/function-package-v69.zip" <<'PY'
          import pathlib
          import sys
          import zipfile

          order = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          with zipfile.ZipFile(sys.argv[2], 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for filename in order:
                  archive.write(filename, arcname=filename)
          PY
          echo "$TARGET_SHA256  $RUNNER_TEMP/function-package-v69.zip" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/function-package-v69.zip")" = "$TARGET_SIZE"
          unzip -t "$RUNNER_TEMP/function-package-v69.zip"

      - name: Replace published package with signed byte-identical file
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/function-package-v69.zip" function-package-v69.zip
          cat > Stadslass_3.0_funktionspaket_69_bytekontroll.txt <<EOF
          STADSLASS 3.0 FUNKTIONSPAKET 69 – BYTEKONTROLL
          Status: godkänd
          GitHub Actions run ID: $GITHUB_RUN_ID
          Paket: function-package-v69.zip
          Storlek: $TARGET_SIZE byte
          SHA-256: $TARGET_SHA256
          Orsak till rättning: ZIP-tidsstämplar skapades tidigare i Europe/Stockholm i stället för UTC
          Kodändring: ingen
          Signaturändring: ingen
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add function-package-v69.zip Stadslass_3.0_funktionspaket_69_bytekontroll.txt
          git commit -m 'Rätta byteidentitet för funktionspaket 69'
          git push origin main
