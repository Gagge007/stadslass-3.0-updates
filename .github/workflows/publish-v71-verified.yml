name: Publish verified Stadslass function package v71

on:
  push:
    branches:
      - main
    paths:
      - 'v71-publish/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: https://raw.githubusercontent.com/Gagge007/stadslass-3.0-updates/main/function-package-v70.zip
      SOURCE_SHA256: a0045e4a6f9e9ace05f2751b1c7c58abfb9a905afa48174524e766668c98a426
      TARGET_SHA256: 628568bf09919c56679c09440f0eabda1fc48154ecdbdd9451788e3c32dda91b
      TARGET_SIZE: '313812'
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record started status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > v71-publish-status.txt <<EOF
          state=started
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          trigger_commit=$GITHUB_SHA
          EOF
          git add v71-publish-status.txt
          git commit -m 'Redovisa startad publicering av funktionspaket 71'
          git push origin HEAD:main

      - name: Download and verify package 70 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/function-package-v70.zip" \
            "$SOURCE_URL?v71_run=$GITHUB_RUN_ID"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/function-package-v70.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/function-package-v70.zip"
          mkdir "$RUNNER_TEMP/v71-source"
          unzip -q "$RUNNER_TEMP/function-package-v70.zip" -d "$RUNNER_TEMP/v71-source"

      - name: Apply exact reviewed package 71 source patch
        run: |
          set -euo pipefail
          base64 -d v71-publish/v71-source.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v71-source.patch"
          cd "$RUNNER_TEMP/v71-source"
          patch -p1 --forward --batch < "$RUNNER_TEMP/v71-source.patch"
          rm -rf tests/__pycache__ .pytest_cache

      - name: Generate complete package 71 manifest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v71-source"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          order=[]
          for prefix in ['css','data']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file()])
          order += [root/'index.html']
          order += sorted([p for p in (root/'js').rglob('*') if p.is_file()])
          for prefix in ['reports','tests']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc'])
          def mime(p):
              return {'.css':'text/css','.json':'application/json','.html':'text/html','.js':'text/javascript','.py':'text/x-python','.txt':'text/plain','.md':'text/markdown'}.get(p.suffix.lower(),'application/octet-stream')
          files=[]
          for p in order:
              content=p.read_bytes()
              files.append({'path':p.as_posix(),'sha256':hashlib.sha256(content).hexdigest(),'mimeType':mime(p),'size':len(content)})
          module={'schemaVersion':1,'packageType':'stadslass-web-module','packageVersion':71,'minHostVersionCode':13,'moduleId':'stadslass.core-mail-sync-reader','title':'Stadslass – typsäker rapportdiagnostik och mobil textsäkerhet','entryPoint':'index.html','readyTimeoutMs':30000,'files':files}
          (root/'module.json').write_text(json.dumps(module,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Run source regression tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v71-source"
          export TZ=Europe/Stockholm
          for test_file in tests/*.test.js; do
            echo "RUN node $test_file"
            node "$test_file"
          done
          for test_file in tests/*.test.py; do
            echo "RUN python $test_file"
            python "$test_file"
          done

      - name: Build deterministic package 71 ZIP
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v71-source"
          python - "$RUNNER_TEMP/function-package-v71.zip" <<'PY'
          from pathlib import Path
          import sys, zipfile
          root=Path('.')
          order=[]
          for prefix in ['css','data']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file()])
          order += [root/'index.html']
          order += sorted([p for p in (root/'js').rglob('*') if p.is_file()])
          order += [root/'module.json']
          for prefix in ['reports','tests']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc'])
          fixed=(2026,8,3,9,37,0)
          with zipfile.ZipFile(sys.argv[1],'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in order:
                  info=zipfile.ZipInfo(path.as_posix(),date_time=fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xFFFF)<<16
                  info.create_system=3
                  archive.writestr(info,path.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          echo "$TARGET_SHA256  $RUNNER_TEMP/function-package-v71.zip" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/function-package-v71.zip")" = "$TARGET_SIZE"
          unzip -t "$RUNNER_TEMP/function-package-v71.zip"

      - name: Publish package and activate manifest
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/function-package-v71.zip" function-package-v71.zip
          cat > latest.json <<'EOF'
          {
            "schemaVersion": 1,
            "packageType": "stadslass-web-module-zip-v1",
            "packageVersion": 71,
            "minHostVersionCode": 13,
            "payloadUrl": "https://raw.githubusercontent.com/Gagge007/stadslass-3.0-updates/main/function-package-v71.zip",
            "payloadSha256": "628568bf09919c56679c09440f0eabda1fc48154ecdbdd9451788e3c32dda91b",
            "payloadSignature": "",
            "publishedAt": "2026-08-03T09:38:50.000Z"
          }
          EOF
          cat > Stadslass_3.0_funktionspaket_71_bytekontroll.txt <<EOF
          STADSLASS 3.0 FUNKTIONSPAKET 71 – BYTEKONTROLL
          Status: godkänd
          GitHub Actions run ID: $GITHUB_RUN_ID
          Paket: function-package-v71.zip
          Storlek: $TARGET_SIZE byte
          SHA-256: $TARGET_SHA256
          Källpaket: function-package-v70.zip
          Källpaket SHA-256: $SOURCE_SHA256
          latest.json: aktiverad i samma publiceringscommit
          EOF
          cat > v71-publish-status.txt <<EOF
          state=succeeded
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          target_sha256=$TARGET_SHA256
          target_size=$TARGET_SIZE
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add function-package-v71.zip latest.json Stadslass_3.0_funktionspaket_71_bytekontroll.txt v71-publish-status.txt
          git commit -m 'Publicera och aktivera funktionspaket 71'
          git push origin main

      - name: Record failed status
        if: failure()
        run: |
          set +e
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > v71-publish-status.txt <<EOF
          state=failed
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          trigger_commit=$GITHUB_SHA
          EOF
          git add v71-publish-status.txt
          git commit -m 'Redovisa misslyckad publicering av funktionspaket 71'
          git push origin main
