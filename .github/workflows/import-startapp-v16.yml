name: Verify published Stadslass startapp v16

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-startapp-v16.yml'

permissions:
  contents: write

jobs:
  verify-public-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository state
        uses: actions/checkout@v6

      - name: Verify committed APK bytes
        run: |
          set -euo pipefail
          test -f Stadslass-3.0-startapp-v16.apk
          ACTUAL_SHA=$(sha256sum Stadslass-3.0-startapp-v16.apk | awk '{print $1}')
          ACTUAL_SIZE=$(stat -c '%s' Stadslass-3.0-startapp-v16.apk)
          test "$ACTUAL_SHA" = 'cefb61ee029834cba55736c4f299cc4aa2829f60dc37158f056ca9336ed85c24'
          test "$ACTUAL_SIZE" -eq 1967939
          {
            echo 'status=PASS'
            echo "apk_sha256=$ACTUAL_SHA"
            echo "apk_size_bytes=$ACTUAL_SIZE"
            echo 'versionCode=16'
            echo 'versionName=3.0-host-16'
          } > startapp-v16-publication-check.txt

      - name: Commit publication verification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startapp-v16-publication-check.txt
          git commit -m "Verifiera publicerad startapp v16"
          git push origin HEAD:main
