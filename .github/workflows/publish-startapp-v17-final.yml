name: Finalize verified Stadslass startapp v17

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-startapp-v17-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-startapp-v17-final
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out update repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Redovisa startad slutpublicering
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > startapp-v17-final-status.txt <<EOF
          state=started
          run_id=$GITHUB_RUN_ID
          EOF
          git add startapp-v17-final-status.txt
          git commit -m 'Redovisa startad slutpublicering av startapp 17'
          git push origin HEAD:main

      - name: Hämta mellanlagrad verifierad APK och metadata
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/startapp-build-metadata-v17.json" \
            "https://raw.githubusercontent.com/Gagge007/Stadslass-3.0/main/startapp-build-metadata-v17.json?run=$GITHUB_RUN_ID"
          curl -fL --retry 4 --retry-delay 3 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/Stadslass-3.0-startapp-v17.apk" \
            "https://raw.githubusercontent.com/Gagge007/Stadslass-3.0/main/Stadslass-3.0-startapp-v17.apk?run=$GITHUB_RUN_ID"

      - name: Kontrollera version, certifikatmetadata och byteidentitet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          meta=json.loads((root/'startapp-build-metadata-v17.json').read_text(encoding='utf-8'))
          data=(root/'Stadslass-3.0-startapp-v17.apk').read_bytes()
          assert meta['packageType']=='stadslass-startapp-apk-v1'
          assert meta['packageId']=='se.gagge007.stadslass.v3'
          assert meta['versionCode']==17
          assert meta['versionName']=='3.0-host-17'
          assert meta['minimumUpdaterVersionCode']==16
          assert meta['required'] is True
          assert meta['signingCertificateSha256']=='43817388a16025298e2f85453f21ec125e0efd27bea98128b02dc5f3c2127b19'
          assert hashlib.sha256(data).hexdigest()==meta['apkSha256']
          assert len(data)==meta['apkSizeBytes']
          PY

      - name: Publicera APK och aktivera automatisk uppdatering
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/Stadslass-3.0-startapp-v17.apk" ./Stadslass-3.0-startapp-v17.apk
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          meta=json.loads((root/'startapp-build-metadata-v17.json').read_text(encoding='utf-8'))
          manifest={
              'schemaVersion':1,
              'packageType':'stadslass-startapp-apk-v1',
              'packageId':'se.gagge007.stadslass.v3',
              'versionCode':17,
              'versionName':'3.0-host-17',
              'apkUrl':'https://raw.githubusercontent.com/Gagge007/stadslass-3.0-updates/main/Stadslass-3.0-startapp-v17.apk',
              'apkSha256':meta['apkSha256'],
              'apkSizeBytes':meta['apkSizeBytes'],
              'signingCertificateSha256':meta['signingCertificateSha256'],
              'minimumUpdaterVersionCode':16,
              'required':True,
              'publishedAt':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
          }
          Path('startapp-latest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          Path('startapp-v17-final-status.txt').write_text(
              'state=succeeded\n'
              f"run_id={os.environ['GITHUB_RUN_ID']}\n"
              f"apk_sha256={meta['apkSha256']}\n"
              f"apk_size={meta['apkSizeBytes']}\n",
              encoding='utf-8'
          )
          PY
          rm -f Stadslass-3.0-startapp-v16.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Stadslass-3.0-startapp-v16.apk Stadslass-3.0-startapp-v17.apk startapp-latest.json startapp-v17-final-status.txt
          git commit -m 'Publicera och aktivera startapp 17'
          git push origin HEAD:main

      - name: Redovisa misslyckad slutpublicering
        if: failure()
        run: |
          set +e
          git fetch origin main
          git checkout -B failed-final-v17 origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > startapp-v17-final-status.txt <<EOF
          state=failed
          run_id=$GITHUB_RUN_ID
          EOF
          git add startapp-v17-final-status.txt
          git commit -m 'Redovisa misslyckad slutpublicering av startapp 17'
          git push origin HEAD:main
