name: Publish verified Stadslass startapp v17 now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-existing-startapp-v17-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-startapp-v17
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out update repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Hämta verifierad startapp 17
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/startapp-build-metadata-v17.json" \
            "https://raw.githubusercontent.com/Gagge007/Stadslass-3.0/main/startapp-build-metadata-v17.json?run=$GITHUB_RUN_ID"
          curl -fL --retry 3 --retry-delay 3 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/Stadslass-3.0-startapp-v17.apk" \
            "https://raw.githubusercontent.com/Gagge007/Stadslass-3.0/main/Stadslass-3.0-startapp-v17.apk?run=$GITHUB_RUN_ID"

      - name: Kontrollera metadata och byteidentitet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          meta=json.loads((root/'startapp-build-metadata-v17.json').read_text(encoding='utf-8'))
          apk=(root/'Stadslass-3.0-startapp-v17.apk').read_bytes()
          assert meta['packageType']=='stadslass-startapp-apk-v1'
          assert meta['packageId']=='se.gagge007.stadslass.v3'
          assert meta['versionCode']==17
          assert meta['versionName']=='3.0-host-17'
          assert meta['minimumUpdaterVersionCode']==16
          assert meta['required'] is True
          assert meta['signingCertificateSha256']=='43817388a16025298e2f85453f21ec125e0efd27bea98128b02dc5f3c2127b19'
          assert hashlib.sha256(apk).hexdigest()==meta['apkSha256']
          assert len(apk)==meta['apkSizeBytes']
          PY

      - name: Verifiera APK-signatur och version
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="$RUNNER_TEMP/Stadslass-3.0-startapp-v17.apk"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 24 -Werr "$APK" | tee "$RUNNER_TEMP/apksigner-check.txt"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "package: name='se.gagge007.stadslass.v3'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "versionCode='17'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "versionName='3.0-host-17'" "$RUNNER_TEMP/apk-badging.txt"
          CERT_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-check.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          test "$CERT_SHA" = '43817388a16025298e2f85453f21ec125e0efd27bea98128b02dc5f3c2127b19'

      - name: Publicera och aktivera startapp 17
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/Stadslass-3.0-startapp-v17.apk" ./Stadslass-3.0-startapp-v17.apk
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          meta=json.loads((root/'startapp-build-metadata-v17.json').read_text(encoding='utf-8'))
          manifest={
              'schemaVersion':1,
              'packageType':'stadslass-startapp-apk-v1',
              'packageId':'se.gagge007.stadslass.v3',
              'versionCode':17,
              'versionName':'3.0-host-17',
              'apkUrl':'https://raw.githubusercontent.com/Gagge007/stadslass-3.0-updates/main/Stadslass-3.0-startapp-v17.apk',
              'apkSha256':meta['apkSha256'],
              'apkSizeBytes':meta['apkSizeBytes'],
              'signingCertificateSha256':meta['signingCertificateSha256'],
              'minimumUpdaterVersionCode':16,
              'required':True,
              'publishedAt':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
          }
          Path('startapp-latest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          Path('startapp-v17-publish-status.txt').write_text(
              'state=succeeded\n'
              f"run_id={os.environ['GITHUB_RUN_ID']}\n"
              f"apk_sha256={meta['apkSha256']}\n"
              f"apk_size={meta['apkSizeBytes']}\n",
              encoding='utf-8'
          )
          PY
          rm -f Stadslass-3.0-startapp-v16.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Stadslass-3.0-startapp-v16.apk Stadslass-3.0-startapp-v17.apk startapp-latest.json startapp-v17-publish-status.txt
          git commit -m 'Publicera och aktivera startapp 17'
          git push origin HEAD:main
