name: Publish Stadslass startapp v17 from verified artifact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-startapp-v17-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-startapp-v17-artifact
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out update repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Redovisa startad artefaktpublicering
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > startapp-v17-artifact-status.txt <<EOF
          state=started
          run_id=$GITHUB_RUN_ID
          source_build_run_id=30808781375
          source_artifact_id=8854099035
          EOF
          git add startapp-v17-artifact-status.txt
          git commit -m 'Redovisa startad artefaktpublicering av startapp 17'
          git push origin HEAD:main

      - name: Hämta verifierad byggartefakt
        run: |
          set -euo pipefail
          ARTIFACT_URL='https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-5618-820a-b5fb-f42c1860a2f9/raw?se=2026-08-03T11:54:18Z&sp=r&sv=2026-02-06&sr=b&scid=87b18c4c-6822-560d-a359-a8f00672b8d5&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T11:10:35Z&ske=2026-08-04T11:10:35Z&sks=b&skv=2026-02-06&sig=kyPRP0pb3bQA4p3kickEHfGOFQtfhcp%2B3giotpsS18Y%3D'
          curl -fL --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/startapp-v17-artifact.zip" "$ARTIFACT_URL"
          mkdir -p "$RUNNER_TEMP/startapp-v17-artifact"
          unzip -q "$RUNNER_TEMP/startapp-v17-artifact.zip" -d "$RUNNER_TEMP/startapp-v17-artifact"
          test -f "$RUNNER_TEMP/startapp-v17-artifact/Stadslass-3.0-startapp-v17.apk"
          test -f "$RUNNER_TEMP/startapp-v17-artifact/startapp-build-metadata-v17.json"

      - name: Kontrollera metadata och byteidentitet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'startapp-v17-artifact'
          meta=json.loads((root/'startapp-build-metadata-v17.json').read_text(encoding='utf-8'))
          apk=(root/'Stadslass-3.0-startapp-v17.apk').read_bytes()
          assert meta['packageType']=='stadslass-startapp-apk-v1'
          assert meta['packageId']=='se.gagge007.stadslass.v3'
          assert meta['versionCode']==17
          assert meta['versionName']=='3.0-host-17'
          assert meta['minimumUpdaterVersionCode']==16
          assert meta['required'] is True
          assert meta['signingCertificateSha256']=='43817388a16025298e2f85453f21ec125e0efd27bea98128b02dc5f3c2127b19'
          assert hashlib.sha256(apk).hexdigest()==meta['apkSha256']
          assert len(apk)==meta['apkSizeBytes']
          PY

      - name: Publicera APK och aktivera automatisk uppdatering
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/startapp-v17-artifact"
          cp "$ROOT/Stadslass-3.0-startapp-v17.apk" ./Stadslass-3.0-startapp-v17.apk
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'startapp-v17-artifact'
          meta=json.loads((root/'startapp-build-metadata-v17.json').read_text(encoding='utf-8'))
          manifest={
              'schemaVersion':1,
              'packageType':'stadslass-startapp-apk-v1',
              'packageId':'se.gagge007.stadslass.v3',
              'versionCode':17,
              'versionName':'3.0-host-17',
              'apkUrl':'https://raw.githubusercontent.com/Gagge007/stadslass-3.0-updates/main/Stadslass-3.0-startapp-v17.apk',
              'apkSha256':meta['apkSha256'],
              'apkSizeBytes':meta['apkSizeBytes'],
              'signingCertificateSha256':meta['signingCertificateSha256'],
              'minimumUpdaterVersionCode':16,
              'required':True,
              'publishedAt':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
          }
          Path('startapp-latest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          Path('startapp-v17-artifact-status.txt').write_text(
              'state=succeeded\n'
              f"run_id={os.environ['GITHUB_RUN_ID']}\n"
              'source_build_run_id=30808781375\n'
              'source_artifact_id=8854099035\n'
              f"apk_sha256={meta['apkSha256']}\n"
              f"apk_size={meta['apkSizeBytes']}\n",
              encoding='utf-8'
          )
          PY
          rm -f Stadslass-3.0-startapp-v16.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Stadslass-3.0-startapp-v16.apk Stadslass-3.0-startapp-v17.apk startapp-latest.json startapp-v17-artifact-status.txt
          git commit -m 'Publicera och aktivera startapp 17'
          git push origin HEAD:main

      - name: Redovisa misslyckad artefaktpublicering
        if: failure()
        run: |
          set +e
          git fetch origin main
          git checkout -B failed-artifact-v17 origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > startapp-v17-artifact-status.txt <<EOF
          state=failed
          run_id=$GITHUB_RUN_ID
          source_build_run_id=30808781375
          source_artifact_id=8854099035
          EOF
          git add startapp-v17-artifact-status.txt
          git commit -m 'Redovisa misslyckad artefaktpublicering av startapp 17'
          git push origin HEAD:main
