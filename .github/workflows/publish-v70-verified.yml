name: Publish verified Stadslass function package v70

on:
  push:
    branches:
      - main
    paths:
      - 'v70-publish/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: https://raw.githubusercontent.com/Gagge007/stadslass-3.0-updates/main/function-package-v69.zip
      SOURCE_SHA256: e57c44f211aae292e04435ed62eff597828a6b186c5795de74a99be3b89eb5c9
      TARGET_SHA256: a0045e4a6f9e9ace05f2751b1c7c58abfb9a905afa48174524e766668c98a426
      TARGET_SIZE: '309684'
    steps:
      - name: Check out publication repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record started status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > v70-publish-status.txt <<EOF
          state=started
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          trigger_commit=$GITHUB_SHA
          EOF
          git add v70-publish-status.txt
          git commit -m 'Redovisa startad publicering av funktionspaket 70'
          git push origin HEAD:main

      - name: Download and verify package 69 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H 'Cache-Control: no-cache' \
            -o "$RUNNER_TEMP/function-package-v69.zip" \
            "$SOURCE_URL?v70_run=$GITHUB_RUN_ID"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/function-package-v69.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/function-package-v69.zip"
          mkdir "$RUNNER_TEMP/v70-source"
          unzip -q "$RUNNER_TEMP/function-package-v69.zip" -d "$RUNNER_TEMP/v70-source"

      - name: Apply exact reviewed package 70 source patch
        run: |
          set -euo pipefail
          base64 -d v70-publish/v70-source.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/v70-source.patch"
          cd "$RUNNER_TEMP/v70-source"
          patch -p1 --forward --batch < "$RUNNER_TEMP/v70-source.patch"
          cp "$GITHUB_WORKSPACE/v70-publish/tests/report-export-v70.test.js" tests/report-export-v70.test.js
          cp "$GITHUB_WORKSPACE/v70-publish/reports/report-export-v70-report.json" reports/report-export-v70-report.json
          rm -rf tests/__pycache__ .pytest_cache

      - name: Generate complete package 70 manifest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v70-source"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          order=[]
          for prefix in ['css','data']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file()])
          order += [root/'index.html']
          for prefix in ['js','reports','tests']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc'])
          def mime(p):
              return {'.css':'text/css','.json':'application/json','.html':'text/html','.js':'text/javascript','.py':'text/x-python','.txt':'text/plain','.md':'text/markdown'}.get(p.suffix.lower(),'application/octet-stream')
          files=[]
          for p in order:
              content=p.read_bytes()
              files.append({'path':p.as_posix(),'sha256':hashlib.sha256(content).hexdigest(),'mimeType':mime(p),'size':len(content)})
          module={'schemaVersion':1,'packageType':'stadslass-web-module','packageVersion':70,'minHostVersionCode':13,'moduleId':'stadslass.core-mail-sync-reader','title':'Stadslass – tillfällig aktuell rapportexport och aktiva synkrequests','entryPoint':'index.html','readyTimeoutMs':30000,'files':files}
          (root/'module.json').write_text(json.dumps(module,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Run source and browser regression tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v70-source"
          export TZ=Europe/Stockholm
          for test_file in tests/*.test.js; do
            echo "RUN node $test_file"
            node "$test_file"
          done
          for test_file in tests/*.test.py; do
            echo "RUN python $test_file"
            python "$test_file"
          done
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tests/integration_app.py
          rm -rf tests/__pycache__ .pytest_cache

      - name: Build deterministic package 70 ZIP
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v70-source"
          python - "$RUNNER_TEMP/function-package-v70.zip" <<'PY'
          from pathlib import Path
          import sys, zipfile
          root=Path('.')
          order=[root/'module.json']
          for prefix in ['css','data']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file()])
          order += [root/'index.html']
          for prefix in ['js','reports','tests']:
              order += sorted([p for p in (root/prefix).rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc'])
          fixed=(2026,8,3,4,10,0)
          with zipfile.ZipFile(sys.argv[1],'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in order:
                  info=zipfile.ZipInfo(path.as_posix(),date_time=fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xFFFF)<<16
                  info.create_system=3
                  archive.writestr(info,path.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          echo "$TARGET_SHA256  $RUNNER_TEMP/function-package-v70.zip" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/function-package-v70.zip")" = "$TARGET_SIZE"
          unzip -t "$RUNNER_TEMP/function-package-v70.zip"

      - name: Publish package file without activating manifest
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/function-package-v70.zip" function-package-v70.zip
          cat > Stadslass_3.0_funktionspaket_70_bytekontroll.txt <<EOF
          STADSLASS 3.0 FUNKTIONSPAKET 70 – BYTEKONTROLL
          Status: godkänd
          GitHub Actions run ID: $GITHUB_RUN_ID
          Paket: function-package-v70.zip
          Storlek: $TARGET_SIZE byte
          SHA-256: $TARGET_SHA256
          Källpaket: function-package-v69.zip
          Källpaket SHA-256: $SOURCE_SHA256
          latest.json: inte ändrad av workflowet
          EOF
          cat > v70-publish-status.txt <<EOF
          state=succeeded
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          target_sha256=$TARGET_SHA256
          target_size=$TARGET_SIZE
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add function-package-v70.zip Stadslass_3.0_funktionspaket_70_bytekontroll.txt v70-publish-status.txt
          git commit -m 'Publicera verifierat funktionspaket 70'
          git push origin main

      - name: Record failed status
        if: failure()
        run: |
          set +e
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > v70-publish-status.txt <<EOF
          state=failed
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          trigger_commit=$GITHUB_SHA
          EOF
          git add v70-publish-status.txt
          git commit -m 'Redovisa misslyckad publicering av funktionspaket 70'
          git push origin main
